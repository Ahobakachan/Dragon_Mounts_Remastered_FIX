name: Build DMR

on:
  push:
    branches:
      - dmr-fixes
      - feature/dimension-bound-dragons
  pull_request:
    branches:
      - dmr-fixes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Run game tests
        run: ./gradlew runGameTestServer --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dragon-mounts-test-reports
          path: |
            run/test-results.md
            run/logs/latest.log
            build/reports/tests/

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: dragon-mounts-remastered-build
          path: build/libs/*.jar
          if-no-files-found: error
